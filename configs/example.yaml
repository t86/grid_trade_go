system:
  log_level: info
  http_addr: ":8080"
  reduce_only_on_degraded: true
accounts:
  - name: primary
    market_types: ["spot", "futures_um"]
    api_key_env: BINANCE_API_KEY
    secret_key_env: BINANCE_SECRET_KEY
strategies:
  - id: grid-btc
    type: grid
    market: futures_um
    symbol: BTCUSDT
    grid_count: 12
    upper_price: "120000"
    lower_price: "80000"
    base_order_size: "0.001"
