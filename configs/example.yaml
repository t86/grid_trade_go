system:
  log_level: info
  http_addr: ":8080"
  secret_dir: "/etc/grid-trade/accounts"
  reduce_only_on_degraded: true
accounts:
  - name: primary
    enabled: true
    market_types: ["spot", "futures_um"]
    secret_ref: primary
strategies:
  - id: grid-btc
    type: grid
    market: futures_um
    symbol: BTCUSDT
    grid_count: 12
    upper_price: "120000"
    lower_price: "80000"
    base_order_size: "0.001"
